<main class="bookings-page">
  <header class="bookings-heading">
    <span class="eyebrow">MINHA CONTA</span>
    <h1>Minhas reservas</h1>
    <p>Acompanhe o status das suas solicitações.</p>
  </header>
  <nz-spin [nzSpinning]="isSpinning">
    <div class="booking-list" *ngIf="bookings.length; else noBookings">
      <article class="booking-card" *ngFor="let booking of bookings">
        <div><strong>Reserva #{{booking.id}}</strong><span>Veículo solicitado</span></div>
        <b>{{booking.bookCarStatus}}</b>
      </article>
    </div>
  </nz-spin>
  <ng-template #noBookings><div class="empty-state">Você ainda não possui reservas.</div></ng-template>
</main>
